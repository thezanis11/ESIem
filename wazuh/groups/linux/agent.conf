<agent_config os="Linux">
  <localfile><location>/var/log/auth.log</location><log_format>syslog</log_format></localfile>
  <localfile><location>/var/log/audit/audit.log</location><log_format>audit</log_format></localfile>
  <syscheck>
    <frequency>3600</frequency><scan_on_start>yes</scan_on_start>
    <directories check_all="yes" realtime="yes" report_changes="no">/etc/ssh,/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes" report_changes="no">/etc/passwd,/etc/shadow,/etc/sudoers</directories>
    <nodiff>/etc/shadow</nodiff>
  </syscheck>
  <wodle name="syscollector"><disabled>no</disabled><interval>1h</interval><packages>yes</packages><os>yes</os></wodle>
  <sca><enabled>yes</enabled><interval>12h</interval></sca>
</agent_config>
